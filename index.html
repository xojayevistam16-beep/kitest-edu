      "@context": "https://schema.org",

    <!-- Inspect & Source Code Shield -->
    <script>
      (function() {
        // Disable right click context menu (Inspect Element)
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // Block developer tools keyboard shortcuts
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.keyCode === 123 || e.key === 'F12') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I or Cmd+Option+I (Inspect)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.key === 'I' || e.key === 'i')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+J or Cmd+Option+J (Console)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 74 || e.key === 'J' || e.key === 'j')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+C (Inspect element)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 67 || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U or Cmd+U (View source)
          if ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+S or Cmd+S (Save page)
          if ((e.ctrlKey || e.metaKey) && (e.keyCode === 83 || e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        });

        // Clear console logs in browser
        if (typeof console !== 'undefined') {
          const noop = function() {};
          console.log = noop;
          console.debug = noop;
          console.info = noop;
        }
      })();
    </script>
